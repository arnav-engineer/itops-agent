[project]
name = "itops-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arnav-engineer", email = "arnav.gupta.9404@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.1.0",
    "ipykernel>=7.4.0",
    "laya>=0.4.15",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "sentencepiece>=0.2.2",
    "tabulate>=0.10.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[project.scripts]
itops-agent = "itops_agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
